name: CD - Google Cloud

on:
  workflow_run:
    workflows:
      - "VITALIS CI"
    types:
      - completed
    branches:
      - develop


permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: vitalis-509611
  REGION: europe-west1
  REPOSITORY: vitalis-repo
  BACKEND_SERVICE: vitalis-backend
  FRONTEND_SERVICE: vitalis-frontend

jobs:
  deploy:
    name: Deploy VITALIS to Google Cloud
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop'

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/148191533656/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-cd@vitalis-509611.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Define image names
        run: |
          echo "BACKEND_IMAGE=europe-west1-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/vitalis-backend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=europe-west1-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/vitalis-frontend:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile.cloudrun \
            -t "$BACKEND_IMAGE" \
            backend

      - name: Push backend image
        run: |
          docker push "$BACKEND_IMAGE"

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "$BACKEND_SERVICE" \
            --image="$BACKEND_IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --quiet

      - name: Get backend URL
        run: |
          BACKEND_URL=$(gcloud run services describe "$BACKEND_SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format='value(status.url)')

          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"
          echo "Backend URL: $BACKEND_URL"

      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg VITE_API_URL="${BACKEND_URL}/api" \
            -t "$FRONTEND_IMAGE" \
            frontend

      - name: Push frontend image
        run: |
          docker push "$FRONTEND_IMAGE"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy "$FRONTEND_SERVICE" \
            --image="$FRONTEND_IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --quiet

      - name: Deployment summary
        run: |
          FRONTEND_URL=$(gcloud run services describe "$FRONTEND_SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format='value(status.url)')

          echo "========================================"
          echo "VITALIS DEPLOYMENT SUCCESSFUL"
          echo "Backend  : $BACKEND_URL"
          echo "Frontend : $FRONTEND_URL"
          echo "========================================"
