name: Security lockfile refresh

on:
  push:
    branches:
      - feature/security-hardening-final

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/security-hardening-final

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Refresh Composer security patch
        working-directory: backend
        run: composer update league/commonmark --with-dependencies --minimal-changes --no-interaction --no-scripts

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Refresh npm security patches
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Commit refreshed lockfiles
        run: |
          if git diff --quiet -- backend/composer.lock frontend/package-lock.json; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/composer.lock frontend/package-lock.json
          git commit -m "security: refresh vulnerable dependency lockfiles"
          git push origin HEAD:feature/security-hardening-final
